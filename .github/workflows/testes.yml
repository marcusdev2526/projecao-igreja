# Testes automáticos: rodam a cada envio para o GitHub.
# O botão "Atualizar" do sistema só instala versões em que estes testes passaram.
name: Testes
on:
  push:
  pull_request:
# o robô dos testes só pode ler o código (não consegue alterar nada no repositório)
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do servidor, letras, Bíblia e segurança
        run: npm test
      - name: Navegador para o teste de tela
        run: npx playwright install --with-deps chromium
      - name: Teste de tela (painel, telão, temas)
        run: npm run test:e2e
