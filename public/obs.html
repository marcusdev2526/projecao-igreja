<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Legenda para transmissão (OBS)</title>
<link rel="stylesheet" href="/fonts/inter/600.css">
<link rel="stylesheet" href="/fonts/inter/700.css">
<link rel="stylesheet" href="/fonts/inter/400-italic.css">
<style>
  /* Fundo transparente: no OBS, use uma fonte "Navegador" com 1920 x 1080 */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: Inter, Arial, sans-serif; color: #fff; }
  .wrap { position: absolute; left: 0; right: 0; bottom: 6vh; display: flex; justify-content: center; padding: 0 6vw; transition: opacity .5s ease; }
  .wrap.top { bottom: auto; top: 6vh; }
  .box { max-width: 88vw; text-align: center; padding: 1.4vh 2.4vw; border-radius: 1.2vh; }
  .faixa .box { background: rgba(0, 0, 0, .62); }
  .pt { font-weight: 700; font-size: calc(var(--s, 1) * 4.6vh); line-height: 1.2; text-shadow: 0 .3vh 1.2vh rgba(0,0,0,.85), 0 0 .4vh rgba(0,0,0,.9); }
  .en { font-style: italic; font-weight: 400; font-size: calc(var(--s, 1) * 3.2vh); line-height: 1.25; color: #dfe9ff; margin-top: .6vh; text-shadow: 0 .3vh 1vh rgba(0,0,0,.85); }
  .ref { font-weight: 700; font-size: calc(var(--s, 1) * 2.2vh); letter-spacing: .12em; text-transform: uppercase; opacity: .85; margin-top: .8vh; text-shadow: 0 .2vh .8vh rgba(0,0,0,.85); }
  .hide { opacity: 0; }
</style>
</head>
<body>
<div class="wrap hide" id="wrap"><div class="box"><div id="txt"></div></div></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
  import { stripMarkup, niceCase } from '/shared/render.js';
  const qs = new URLSearchParams(location.search);
  const wrap = document.getElementById('wrap');
  if (qs.get('faixa') === '1') document.body.classList.add('faixa');
  if (qs.get('pos') === 'topo') wrap.classList.add('top');
  if (qs.get('tamanho')) document.body.style.setProperty('--s', Math.max(0.4, +qs.get('tamanho') / 100));
  const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  io().on('state', (s0) => {
    const s = s0.frozen && s0.screen ? { ...s0, ...s0.screen } : s0; // mostra o que o público vê
    const sl = s.slide;
    const hidden = !sl || s.clear || s.black || s.logo || s.waiting || s.showBase || sl.kind === 'media';
    wrap.classList.toggle('hide', hidden);
    if (hidden) return;
    const enMain = s.mode === 'en' || s.mode === 'en-pt';
    const bi = s.mode === 'pt-en' || s.mode === 'en-pt';
    const lines = sl.lines || [];
    const main = lines.map((l) => niceCase(enMain && l.en ? l.en : stripMarkup(l.pt))).filter(Boolean).join('<br>');
    const sec = bi ? lines.map((l) => niceCase(enMain ? stripMarkup(l.pt) : l.en)).filter(Boolean).join('<br>') : '';
    const ref = sl.kind === 'bible' ? (enMain ? sl.ref?.en : sl.ref?.pt) || sl.name : '';
    document.getElementById('txt').innerHTML = `<div class="pt">${main.split('<br>').map(esc).join('<br>')}</div>${sec ? `<div class="en">${sec.split('<br>').map(esc).join('<br>')}</div>` : ''}${ref ? `<div class="ref">${esc(ref)}</div>` : ''}`;
  });
</script>
</body>
</html>
