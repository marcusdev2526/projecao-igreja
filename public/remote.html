<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Controle — Projeção Igreja</title>
<style>
  @import url('/fonts/inter/400.css'); @import url('/fonts/inter/600.css'); @import url('/fonts/inter/700.css');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #070b12; color: #e8eaed; font-family: Inter, system-ui, sans-serif; padding-bottom: 240px; }
  header { position: sticky; top: 0; background: #070b12ee; backdrop-filter: blur(8px); padding: 12px 14px 8px; z-index: 2; border-bottom: 1px solid #222; }
  h1 { font-size: 17px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: #8a919a; font-size: 13px; margin-top: 2px; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tabs button, .modes button { flex: 1; background: #132033; color: #cfd3d8; border: 0; border-radius: 9px; padding: 9px 4px; font: 600 13px Inter, sans-serif; }
  .tabs button.on, .modes button.on { background: #1f78d1; color: #fff; }
  .list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .slide, .item { background: #0f1826; border: 2px solid transparent; border-radius: 12px; padding: 12px 14px; text-align: left; color: inherit; font: inherit; width: 100%; }
  .slide.on, .item.on { border-color: #f2921e; background: #2a1d0c; }
  .slide .n { font-size: 11px; font-weight: 700; color: #fcc12d; letter-spacing: .06em; text-transform: uppercase; }
  .slide .t { font-size: 15px; margin-top: 4px; line-height: 1.35; }
  .item .t { font-weight: 600; } .item .a { font-size: 12px; color: #8a919a; margin-top: 2px; }
  .modes { display: flex; gap: 6px; padding: 0 12px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: #070b12; border-top: 1px solid #222; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
  footer button { border: 0; border-radius: 12px; font: 700 15px Inter, sans-serif; padding: 16px 4px; background: #132033; color: #e8eaed; }
  footer .big { grid-column: span 2; background: #1f78d1; color: #fff; font-size: 20px; padding: 22px 4px; }
  footer .prev { grid-column: span 2; font-size: 20px; padding: 22px 4px; }
  footer .on { background: #e33; color: #fff; }
  footer #freeze.on { background: #2b9fd8; } footer #base.on { background: #1f78d1; }
  .media { position: fixed; left: 0; right: 0; bottom: 172px; display: none; gap: 8px; padding: 8px 12px; background: #070b12; border-top: 1px solid #222; }
  .media.on { display: flex; } .media button { flex: 1; border: 0; border-radius: 10px; background: #132033; color: #fff; font: 700 15px Inter, sans-serif; padding: 12px 4px; }
  .media .pp { background: #1f78d1; }
  .media .nm { flex: 2.2; font-size: 12px; color: #9aa; display: flex; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .bsearch { padding: 10px 12px 0; } .bsearch input { width: 100%; background: #0f1826; border: 1px solid #2a2f37; border-radius: 10px; color: #fff; padding: 12px; font: 15px Inter, sans-serif; }
  .hit .r { font-weight: 700; } .hit .x { font-size: 13px; color: #9aa; margin-top: 3px; }
  .frz { background: #1d5fae; color: #fff; text-align: center; font-weight: 700; font-size: 13px; padding: 6px; border-radius: 8px; margin-top: 8px; display: none; }
  .frz.on { display: block; }
  .msg { display: flex; gap: 6px; padding: 4px 12px 10px; }
  .msg input { flex: 1; background: #0f1826; border: 1px solid #2a2f37; border-radius: 9px; color: #fff; padding: 10px; font: 14px Inter, sans-serif; }
  .msg button { background: #2b3340; color: #fff; border: 0; border-radius: 9px; padding: 0 14px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1 id="title">Conectando…</h1>
  <div class="sub" id="sub"></div>
  <div id="prog" hidden></div>
  <div class="frz" id="frz">TELÃO CONGELADO · você está preparando o próximo</div>
  <div class="tabs"><button data-tab="slides" class="on">Slides</button><button data-tab="culto">Culto</button><button data-tab="biblia">Bíblia</button><button data-tab="mais">Mais</button></div>
</header>
<div id="slides" class="list"></div>
<div id="culto" class="list" hidden></div>
<div id="biblia" hidden><div class="bsearch"><input id="bq" placeholder="jo 3 16 · sl 23 · palavras" autocomplete="off"></div><div class="list" id="bres"></div></div>
<div id="mais" hidden>
  <div class="list"><div class="sub">Idioma no telão</div></div>
  <div class="modes" id="modes">
    <button data-mode="pt">PT</button><button data-mode="pt-en">PT + EN</button><button data-mode="en">EN</button><button data-mode="en-pt">EN + PT</button>
  </div>
  <div class="list"><div class="sub">Recado para o retorno (só aparece no palco)</div></div>
  <div class="msg"><input id="msgIn" placeholder="Ex.: mais uma vez o refrão" maxlength="140"><button id="msgSend">Enviar</button><button id="msgClear">Limpar</button></div>
</div>
<div class="media" id="media"><span class="nm" id="mname"></span><button id="mback">−10s</button><button class="pp" id="mplay">▶</button><button id="mfwd">+10s</button></div>
<footer>
  <button class="prev" id="prev">◀ Voltar</button>
  <button class="big" id="next">Próximo ▶</button>
  <button id="freeze">Congelar</button>
  <button id="base">Cartaz</button>
  <button id="black">Tela preta</button>
  <button id="clear">Sem letra</button>
</footer>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
  import { stripMarkup } from '/shared/render.js';
  import { refText } from '/shared/bible.js';
  import { renderProgress, PROGRESS_CSS } from '/shared/progress.js';
  document.head.insertAdjacentHTML('beforeend', `<style>${PROGRESS_CSS}.prog-meta{display:none}</style>`);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const socket = io();
  socket.on('auth', (a) => { if (!a.control) location.href = '/entrar.html?next=/remote.html'; });
  const cmd = (c) => { socket.emit('cmd', c); navigator.vibrate?.(15); };
  let state = null;
  let serviceId = null;

  document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    ['slides', 'culto', 'biblia', 'mais'].forEach((t) => ($(t).hidden = t !== b.dataset.tab));
    if (b.dataset.tab === 'biblia') setTimeout(() => $('bq').focus(), 50);
    if (b.dataset.tab === 'culto') loadService();
  }));
  $('next').onclick = () => cmd({ type: 'next' });
  $('prev').onclick = () => cmd({ type: 'prev' });
  $('black').onclick = () => cmd({ type: 'black' });
  $('clear').onclick = () => cmd({ type: 'clear' });
  $('freeze').onclick = () => cmd({ type: 'freeze' });
  $('base').onclick = () => (state?.base ? cmd({ type: 'base-show' }) : alert('Nenhum cartaz fixado no painel'));
  $('mplay').onclick = () => cmd({ type: 'player', action: state?.player?.status === 'playing' ? 'pause' : state?.player?.status === 'stopped' ? 'restart' : 'play' });
  $('mback').onclick = () => cmd({ type: 'player', action: 'skip', value: -10 });
  $('mfwd').onclick = () => cmd({ type: 'player', action: 'skip', value: 10 });
  // Bíblia pelo celular
  let bt;
  $('bq').oninput = () => { clearTimeout(bt); bt = setTimeout(bsearch, 250); };
  async function bsearch() {
    const q = $('bq').value.trim();
    if (!q) return ($('bres').innerHTML = '');
    const r = await (await fetch('/api/bible/search?q=' + encodeURIComponent(q))).json();
    if (r.ref) {
      const ch = await (await fetch(`/api/bible/chapter?book=${r.ref.book}&chapter=${r.ref.chapter}`)).json();
      $('bres').innerHTML = ch.verses.map((v) => `<button class="slide hit ${v.verse === r.ref.verse ? 'on' : ''}" data-b="${r.ref.book}" data-c="${r.ref.chapter}" data-v="${v.verse}"><div class="n">${refText(r.ref.book, r.ref.chapter, v.verse)}</div><div class="t">${esc(v.text)}</div></button>`).join('');
      $('bres').querySelector('.on')?.scrollIntoView({ block: 'center' });
    } else {
      $('bres').innerHTML = (r.hits || []).slice(0, 40).map((h) => `<button class="slide hit" data-b="${h.book}" data-c="${h.chapter}" data-v="${h.verse}"><div class="n">${refText(h.book, h.chapter, h.verse)}</div><div class="t">${esc(h.text)}</div></button>`).join('') || '<div class="sub">Nada encontrado</div>';
    }
  }
  $('bres').onclick = (e) => { const h = e.target.closest('.hit'); if (h) cmd({ type: 'bible', book: +h.dataset.b, chapter: +h.dataset.c, verse: +h.dataset.v }); };
  $('modes').onclick = (e) => e.target.dataset.mode && cmd({ type: 'mode', value: e.target.dataset.mode });
  $('msgSend').onclick = () => cmd({ type: 'message', value: $('msgIn').value });
  $('msgClear').onclick = () => { $('msgIn').value = ''; cmd({ type: 'message', value: '' }); };

  async function loadService() {
    serviceId = state?.serviceId;
    if (!serviceId) {
      const list = await (await fetch('/api/services')).json();
      serviceId = list[0]?.id;
    }
    if (!serviceId) return ($('culto').innerHTML = '<div class="sub">Nenhum culto montado</div>');
    const svc = await (await fetch('/api/services/' + serviceId)).json();
    $('culto').innerHTML = `<div class="sub">${esc(svc.title)}</div>` + svc.items
      .map((it) => `<button class="item ${state?.itemId === it.id ? 'on' : ''}" data-id="${it.id}"><div class="t">${esc(it.kind === 'song' ? it.song_title : it.title || 'Aviso')}</div><div class="a">${esc(it.kind === 'song' ? it.song_artist || '' : 'Aviso')}</div></button>`)
      .join('');
    $('culto').querySelectorAll('.item').forEach((b) => (b.onclick = () => {
      if (!state?.serviceId) cmd({ type: 'service', id: serviceId });
      cmd({ type: 'item', id: +b.dataset.id });
      document.querySelector('[data-tab=slides]').click();
    }));
  }

  socket.on('state', (s) => {
    const changedSong = !state || state.itemId !== s.itemId || state.songId !== s.songId || state.total !== s.total;
    state = s;
    $('title').textContent = s.title || 'Nada selecionado';
    renderProgress($('prog'), { slides: s.slides, index: s.index, onPick: (i) => cmd({ type: 'goto', index: i }) });
    $('sub').textContent = s.total ? `Slide ${s.index + 1} de ${s.total}` : 'Escolha um louvor na aba Culto';
    $('black').classList.toggle('on', s.black);
    $('freeze').classList.toggle('on', !!s.frozen);
    $('freeze').textContent = s.frozen ? 'Soltar no telão' : 'Congelar';
    $('frz').classList.toggle('on', !!s.frozen);
    $('base').classList.toggle('on', !!s.showBase);
    const p = s.player;
    const showMedia = p && (p.status === 'playing' || (p.itemId && p.itemId === s.itemId) || s.slide?.url === p.url);
    $('media').classList.toggle('on', !!showMedia);
    if (showMedia) { $('mname').textContent = p.name || 'Vídeo'; $('mplay').textContent = p.status === 'playing' ? '❚❚' : '▶'; }
    $('clear').classList.toggle('on', s.clear);
    document.querySelectorAll('#modes button').forEach((b) => b.classList.toggle('on', b.dataset.mode === s.mode));
    if (changedSong) {
      $('slides').innerHTML = s.slides
        .map((sl) => `<button class="slide" data-i="${sl.index}"><div class="n">${esc(sl.name)}${sl.parts > 1 ? ` · ${sl.part}/${sl.parts}` : ''}</div><div class="t">${esc(stripMarkup(sl.preview))}</div></button>`)
        .join('');
      $('slides').querySelectorAll('.slide').forEach((b) => (b.onclick = () => cmd({ type: 'goto', index: +b.dataset.i })));
    }
    $('slides').querySelectorAll('.slide').forEach((b) => b.classList.toggle('on', +b.dataset.i === s.index));
    const on = $('slides').querySelector('.slide.on');
    if (on && changedSong) on.scrollIntoView({ block: 'center' });
  });
  // depois de uma atualização do sistema, recarrega para pegar a versão nova
  { const s2 = io(); s2.on('updating', () => setTimeout(function w() { fetch('/api/info', { cache: 'no-store' }).then(() => location.reload(), () => setTimeout(w, 1500)); }, 3000)); }
</script>
</body>
</html>
