<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entrar · Projeção</title>
<link rel="stylesheet" href="/fonts/inter/400.css"><link rel="stylesheet" href="/fonts/inter/600.css"><link rel="stylesheet" href="/fonts/inter/700.css">
<style>
  :root { --bg: #0a0e14; --panel: #0f141b; --raised: #151b24; --line: #252e3b; --text: #e6eaef; --muted: #8b95a3; --accent: #2b8ad9; --err: #ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; padding: 24px; }
  .card { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px 22px; text-align: center; }
  .lock { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin: 0 auto 14px; background: rgba(43,138,217,.14); color: #7fc0f2; }
  .lock svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  .dots { display: flex; justify-content: center; gap: 12px; margin: 6px 0 18px; height: 16px; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #4a5566; transition: background .15s, border-color .15s; }
  .dots i.on { background: var(--text); border-color: var(--text); }
  .dots.bad i { border-color: var(--err); animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .pad button { height: 58px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--text); font: 600 21px Inter, system-ui, sans-serif; cursor: pointer; }
  .pad button:active { background: #1f2834; }
  .pad .ghost { background: transparent; border-color: transparent; font-size: 14px; color: var(--muted); }
  .go { margin-top: 12px; width: 100%; height: 46px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer; }
  .go:disabled { opacity: .45; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--err); }
  .help { margin-top: 14px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <h1>Digite o PIN da projeção</h1>
  <p id="sub">Pedido só na primeira vez neste aparelho.</p>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <button class="go" id="go" disabled>Entrar</button>
  <div class="msg" id="msg"></div>
  <div class="help">O PIN fica no computador da projeção:<br>Configurações › Segurança.</div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let pin = '';
  const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/'; return n.startsWith('/') && !n.startsWith('//') ? n : '/'; })();
  $('pad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-n="${n}">${n}</button>`).join('') + '<button class="ghost" data-n="c">Limpar</button><button data-n="0">0</button><button class="ghost" data-n="b">⌫</button>';
  const draw = () => {
    $('dots').innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join('');
    $('go').disabled = pin.length < 4;
  };
  const press = (k) => {
    $('msg').textContent = '';
    $('dots').classList.remove('bad');
    if (k === 'c') pin = '';
    else if (k === 'b') pin = pin.slice(0, -1);
    else if (pin.length < 8) pin += k;
    draw();
  };
  $('pad').onclick = (e) => { const b = e.target.closest('button'); if (b) press(b.dataset.n); };
  document.onkeydown = (e) => {
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('b');
    else if (e.key === 'Enter' && pin.length >= 4) $('go').click();
  };
  $('go').onclick = async () => {
    $('go').disabled = true;
    const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) }).catch(() => null);
    if (r?.ok) return location.replace(next);
    const d = r ? await r.json().catch(() => ({})) : { error: 'Sem conexão com o computador da projeção' };
    $('msg').textContent = d.error || 'Não deu certo';
    $('dots').classList.add('bad');
    pin = '';
    draw();
  };
  fetch('/api/auth/status').then((r) => r.json()).then((s) => {
    if (s.level) return location.replace(next);
    if (!s.hasPin) { $('sub').textContent = 'O PIN ainda não foi criado. Peça ao operador para criar em Configurações › Segurança, no computador da projeção.'; }
  }).catch(() => {});
  draw();
</script>
</body>
</html>
