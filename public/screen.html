<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telão — Projeção Igreja</title>
<link rel="stylesheet" href="/shared/stage.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #host { position: fixed; inset: 0; }
  #hint { position: fixed; left: 16px; bottom: 14px; color: #fff8; font: 13px system-ui; transition: opacity 1s; cursor: default; }
  body.embedded #hint { display: none; }
</style>
</head>
<body>
<div id="host"></div>
<div id="hint">Pressione F11 (ou clique duas vezes) para tela cheia · arraste esta janela para o projetor</div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
  import { createStage, slideHTML, logoHTML, waitingHTML, tickWaiting, baseHTML } from '/shared/render.js';
  const embedded = new URLSearchParams(location.search).has('embed');
  // ?real = mostra o que está preparado (ignora o congelamento) — usado no monitor "Preparado" do painel
  const realView = new URLSearchParams(location.search).has('real');
  if (embedded) document.body.classList.add('embedded');
  const stage = createStage(document.getElementById('host'), { live: true });
  let lastKey = '';
  // ?embed = prévia no painel; sem embed = telão de verdade (o painel conta quantos telões estão abertos)
  const socket = io({ query: { role: embedded ? 'preview' : realView ? 'preview' : 'screen' } });
  // Telão que não cai: guarda o último estado e mostra de novo se a página recarregar sem servidor
  const SAVE = 'screen_last_state';
  if (!embedded) {
    try {
      const saved = JSON.parse(localStorage.getItem(SAVE) || 'null');
      if (saved && Date.now() - saved.at < 12 * 3600e3) setTimeout(() => { if (!socket.connected) render({ ...saved.s, player: null }); }, 400);
    } catch {}
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
  let saveT;
  socket.on('state', (s0) => {
    render(s0);
    if (!embedded) { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(SAVE, JSON.stringify({ at: Date.now(), s: s0 })); } catch {} }, 300); }
  });
  function render(s0) {
    // congelado: o telão continua mostrando o que estava no ar
    const s = s0.frozen && s0.screen && !realView ? { ...s0, ...s0.screen } : s0;
    stage.setTheme(s.themeId, s.themeDef);
    stage.setBlack(s.black);
    stage.setTransition(s.transition, s.trSpeed);
    // fundo reage ao refrão
    stage.el.classList.toggle('is-chorus', !s.showBase && !s.clear && s.slide?.type === 'refrao');
    const html = s.waiting ? waitingHTML(s.church) : s.logo ? logoHTML(s.church) : s.showBase && s.base ? baseHTML(s.base) : s.clear || !s.slide ? '' : slideHTML(s.slide, s.mode);
    // marca da igreja embaixo: só com letra ou Bíblia na tela (some na logo, espera, cartaz, vídeo e tela preta)
    const markLogo = s.church?.logo === '/brand/adpc.png' ? '/brand/intro/mask.png' : s.church?.logo;
    const showMark = !!(s.church?.mark && markLogo && s.slide && !s.clear && !s.logo && !s.waiting && !(s.showBase && s.base) && s.slide.kind !== 'media');
    stage.el.style.setProperty('--mark-img', markLogo ? `url("${markLogo}")` : 'none');
    stage.el.classList.toggle('has-mark', showMark);
    const key = s.themeId + '|' + s.mode + '|' + html;
    if (key !== lastKey) { stage.show(html); lastKey = key; tickWaiting(stage.el); checkMark(); }
    applyPlayer(s.player);
  }

  setInterval(() => tickWaiting(stage.el), 1000);

  // Texto grande chegando perto da logo de baixo: a logo some (volta quando o texto for menor)
  function checkMark() {
    const run = () => {
      const mark = stage.el.querySelector('.mark');
      const layer = stage.el.querySelector('.layers > :last-child');
      if (!mark || !layer) return;
      const top = mark.getBoundingClientRect().top;
      let bottom = 0;
      layer.querySelectorAll('.ln, .secondary, .verse, .primary, p, li').forEach((el) => { const r = el.getBoundingClientRect(); if (r.height) bottom = Math.max(bottom, r.bottom); });
      if (!bottom) { const r = (layer.firstElementChild || layer).getBoundingClientRect(); bottom = r.bottom; }
      const gap = 24 * (stage.el.getBoundingClientRect().height / 1080);
      stage.el.classList.toggle('mark-hide', bottom > top - gap);
    };
    requestAnimationFrame(() => requestAnimationFrame(run));
    setTimeout(run, 400);
  }
  addEventListener('resize', checkMark);
  window.__checkMark = checkMark;

  // ---------- Vídeo e áudio ----------
  // A janela do telão é quem toca (com som). A prévia do painel (embed) mostra o vídeo sem som.
  const aud = new Audio();
  aud.preload = 'auto';
  let pState = null;
  let applied = -1;
  const mediaEl = (p) => (p?.type === 'video' ? [...document.querySelectorAll('.content-layer:not(.leave) video:not(.base-v)')].pop() : aud);
  function fadeOut(el) {
    clearInterval(el._fade);
    const v0 = el.volume;
    el._v0 = v0;
    let k = 0;
    el._fade = setInterval(() => { k++; el.volume = Math.max(0, v0 * (1 - k / 12)); if (k >= 12) { clearInterval(el._fade); el._fade = null; el.pause(); el.volume = v0; } }, 60);
  }
  const cancelFade = (el) => { if (el?._fade) { clearInterval(el._fade); el._fade = null; el.volume = el._v0 ?? 1; } };
  function applyPlayer(p) {
    if (!p) { if (!aud.paused) fadeOut(aud); pState = null; return; }
    if (p.seq === applied && mediaEl(p) === pState?.el) return;
    applied = p.seq;
    const el = mediaEl(p);
    if (p.type === 'audio' && aud.dataset.url !== p.url) { aud.src = p.url; aud.dataset.url = p.url; }
    if (p.type === 'video' && !aud.paused) fadeOut(aud);
    pState = { ...p, el };
    if (!el) return;
    el.muted = embedded;
    el.volume = p.volume ?? 1;
    el.playbackRate = p.rate || 1;
    el.loop = false;
    if (p.seek != null && isFinite(p.seek)) { try { el.currentTime = p.seek; } catch {} }
    if (p.status === 'playing') {
      cancelFade(el);
      el.play().catch(() => { if (!embedded) { el.muted = true; el.play().catch(() => {}); socket.emit('player-blocked'); } });
    } else if (p.status === 'stopped' && p.type === 'audio') { if (!el.paused) fadeOut(el); }
    else { el.pause(); if (p.type === 'video' && el.currentTime === 0 && el.readyState < 2) el.addEventListener('loadeddata', () => { try { el.currentTime = 0.05; } catch {} }, { once: true }); }
    if (!embedded && !el._wired) {
      el._wired = true;
      let last = 0;
      el.addEventListener('timeupdate', () => {
        if (Date.now() - last < 400) return;
        last = Date.now();
        socket.emit('player-time', { t: el.currentTime, d: el.duration || 0, seq: pState?.seq });
      });
      el.addEventListener('ended', () => socket.emit('player-ended', { seq: pState?.seq }));
      const rep = () => socket.emit('player-time', { t: el.currentTime, d: el.duration || 0, seq: pState?.seq });
      el.addEventListener('loadedmetadata', rep);
      el.addEventListener('seeked', rep);
      el.addEventListener('pause', rep);
    }
  }
  // Passador de slides com a janela do telão em foco
  if (!embedded) {
    addEventListener('keydown', (e) => {
      if (e.key === 'F5' && !e.ctrlKey) return e.preventDefault();
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const c = ['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key) ? { type: 'next' }
        : ['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key) ? { type: 'prev' }
        : ['b', 'B', '.'].includes(e.key) ? { type: 'black' }
        : [',', 'w', 'W'].includes(e.key) ? { type: 'clear' } : null;
      if (c) { e.preventDefault(); socket.emit('cmd', c); }
    });
  }
  // O painel mostra a prévia no mesmo formato da tela do telão (16:9, ultrawide…)
  if (!embedded) {
    let sent = 0;
    const tell = () => { const ar = Math.round((innerWidth / innerHeight) * 1000) / 1000; if (ar !== sent && isFinite(ar)) { sent = ar; socket.emit('screen-aspect', ar); } };
    addEventListener('resize', () => setTimeout(tell, 300));
    socket.on('connect', () => { sent = 0; tell(); });
    tell();
  }
  // a prévia acompanha o tempo do telão
  if (embedded && !realView) socket.on('player-time', ({ t }) => { const el = pState && mediaEl(pState); if (el && Math.abs(el.currentTime - t) > 1.2) try { el.currentTime = t; } catch {} });
  document.addEventListener('dblclick', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  setTimeout(() => (document.getElementById('hint').style.opacity = 0), 6000);
  // depois de uma atualização do sistema, recarrega para pegar a versão nova
  { const s2 = io(); s2.on('updating', () => setTimeout(function w() { fetch('/api/info', { cache: 'no-store' }).then(() => location.reload(), () => setTimeout(w, 1500)); }, 3000)); }
</script>
</body>
</html>
